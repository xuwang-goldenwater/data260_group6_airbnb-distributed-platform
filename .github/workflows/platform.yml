name: Platform and contracts
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: airbnb_booking_test
          MYSQL_USER: airbnb
          MYSQL_PASSWORD: airbnb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r services/platform/requirements.txt -r services/ai/requirements.txt -r services/booking-api/requirements.txt
      - run: make test
      - run: docker compose -f infra/docker-compose.yml config --quiet
