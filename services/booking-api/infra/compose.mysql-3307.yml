# Role B local override: use when host port 3306 is already taken (e.g. a Homebrew MySQL).
# Usage: docker compose -f infra/docker-compose.yml -f services/booking-api/infra/compose.mysql-3307.yml up -d
# Then set MYSQL_PORT=3307 in services/booking-api/.env
services:
  mysql:
    ports: !override
      - "3307:3306"
