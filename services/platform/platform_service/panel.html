<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform · DATA260 Group 6</title>
<style>body{font:16px system-ui;background:#f3f5f8;color:#192b40;max-width:1000px;margin:48px auto;padding:20px}section{background:white;padding:24px;border-radius:12px;margin:20px 0}input,textarea,button,select{font:inherit;padding:10px;margin:5px;border:1px solid #bdc8d6;border-radius:6px}button{background:#164c63;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:90%}label{display:block}</style>
<h1>Platform and Messaging</h1><p>DATA260 Group 6 · Matthew · Role C</p>
<section><label>JWT token (kept in this tab only)<input id="token" type="password" autocomplete="off" size="50"></label><p id="status" role="status">Guest/host token for messages; service/admin token for platform metrics.</p></section>
<section><h2>Event health</h2><button id="refresh">Refresh platform metrics</button><div id="chart" aria-label="Events by topic chart"></div><pre id="metrics">No data loaded.</pre><label>Trace ID<input id="trace"></label><button id="trace-load">Read trace</button><pre id="trace-events"></pre></section>
<section><h2>Messages</h2><label>Reservation ID<input id="reservation"></label><button id="open-thread">Open conversation</button><br><button id="threads">Load my conversations</button><select id="conversations" aria-label="Conversation"></select><button id="load">Read conversation</button><pre id="messages"></pre><label>Recipient ID<input id="recipient"></label><textarea id="body" maxlength="4000" placeholder="Write your message"></textarea><br><button id="send">Send message</button></section>
<script>
const $=id=>document.getElementById(id);let sendKey=null,sendPayload=null;
async function api(path,method='GET',body,key){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json',...(key?{'Idempotency-Key':key}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error?.message||'Request failed');return data;}
function task(fn){return async()=>{try{await fn();$('status').textContent='Updated '+new Date().toLocaleTimeString();}catch(e){$('status').textContent=e.message;}}}
$('refresh').onclick=task(async()=>{const data=await api('/analytics/platform?include_lag=true');$('metrics').textContent=JSON.stringify(data,null,2);const entries=Object.entries(data.events_by_topic);const max=Math.max(1,...entries.map(e=>e[1]));$('chart').replaceChildren(...entries.map(([topic,count])=>{const row=document.createElement('div');row.textContent=topic+' '+count;const bar=document.createElement('div');bar.style.cssText='height:12px;margin:4px 0 12px;background:#287d9b;width:'+(100*count/max)+'%';row.append(bar);return row;}));});
$('trace-load').onclick=task(async()=>$('trace-events').textContent=JSON.stringify(await api('/analytics/traces/'+encodeURIComponent($('trace').value)),null,2));
$('open-thread').onclick=task(async()=>{const c=await api('/threads/open','POST',{reservation_id:$('reservation').value});const option=document.createElement('option');option.value=c.conversation_id;option.textContent=c.conversation_id;$('conversations').append(option);$('conversations').value=c.conversation_id;await load();});
$('threads').onclick=task(async()=>{const data=await api('/messages/conversations');$('conversations').replaceChildren(...data.items.map(c=>{const o=document.createElement('option');o.value=c.conversation_id;o.textContent=c.conversation_id+' · '+c.guest_id+' / '+c.host_id;return o;}));});
async function load(){const data=await api('/messages/conversation','POST',{conversation_id:$('conversations').value,page:1,page_size:50});$('messages').textContent=data.items.map(m=>m.sender_id+' ['+m.delivery_status+']: '+m.body).join('\n');}
$('load').onclick=task(load);
$('send').onclick=task(async()=>{const body={conversation_id:$('conversations').value,recipient_id:$('recipient').value,body:$('body').value};const fingerprint=JSON.stringify(body);if(sendPayload!==fingerprint){sendKey=crypto.randomUUID();sendPayload=fingerprint;}await api('/messages/send','POST',body,sendKey);$('body').value='';sendKey=null;sendPayload=null;await load();});
</script></html>
